name: CI

on: push

# The workflow only reads the repo (build + test); never grant the default
# token more than that (2026-07-30 audit).
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14"
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune test

      # Licensed benchmark corpora must stay out of a public MIT repo's
      # history, and history is the part you cannot take back (2026-08-01
      # audit). Fails if an ignore rule is dropped or a corpus gets tracked.
      - name: benchmark corpora and cached model replies stay untracked
        run: |
          for p in data/raw data/results data/eval data/cache; do
            git check-ignore -q "$p/probe" \
              || { echo "::error::$p is no longer gitignored"; exit 1; }
          done
          tracked=$(git ls-files data/raw data/results data/eval data/cache)
          if [ -n "$tracked" ]; then
            echo "::error::corpus or cache files are tracked: $tracked"; exit 1
          fi
